name: Java CI + Docker Push (ha1)

on:
  push:
    branches:
      - ha1          # Chỉ chạy CI trên nhánh ha1
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    #   - name: Set up JDK 17
    #     uses: actions/setup-java@v4
    #     with:
    #       distribution: 'temurin'
    #       java-version: '17'

    #   - name: Build backend
    #     working-directory: ./job-quest-java/jobquestbackend
    #     run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/jobquest-backend:ha1 ./job-quest-java/jobquestbackend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/jobquest-backend:ha1

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (frontend)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jobquest-frontend:ha1 ./job-quest-java/job-quest-frontend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/jobquest-frontend:ha1